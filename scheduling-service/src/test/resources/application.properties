spring.application.name=scheduling-service

# In-memory database for tests - no external Postgres/profile needed to run `mvn test`.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Required by KafkaProducerConfig (no default there) - context must load without a live broker.
spring.kafka.bootstrap-servers=localhost:9092

# Required by SecurityConfig.jwtDecoder (no default there).
app.security.jwt.secret=test-only-secret-not-used-for-real-tokens
