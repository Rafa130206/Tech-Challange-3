spring.application.name=scheduling-service
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# KAFKA CONFIG
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# JWT CONFIG
app.security.jwt.secret=${AUTH_JWT_SECRET:tc3-local-development-secret-key-2026}

# Datasource credentials live in application-local.properties (gitignored).
# See application-local.properties.example for the expected keys.
