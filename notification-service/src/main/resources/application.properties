spring.application.name=notification-service
server.port=8082

# MONGO CONFIG
# Spring Boot 4 moved MongoProperties to the "spring.mongodb.*" prefix
# (the old "spring.data.mongodb.*" prefix from Boot 3 is silently ignored).
spring.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.mongodb.database=notification-service

# KAFKA CONFIG
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.groups.notificacao=notification-service

# SCHEDULE CONFIG
app.notification.dispatch-interval-ms=60000