services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  mongo-notification-service:
    image: mongo:8.0
    container_name: mongo-notification-service
    ports:
      - "27018:27017"
    volumes:
      - mongo-notification-service-data:/data/db

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      - kafka
      - mongo-notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_MONGODB_URI: mongodb://mongo-notification-service:27017/notification-service
    ports:
      - "8082:8082"

  postgres-history-service:
    image: postgres:16
    container_name: postgres-history-service
    environment:
      POSTGRES_DB: history
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminPostgres
    ports:
      - "5435:5432"
    volumes:
      - postgres-history-service-data:/var/lib/postgresql/data

  history-service:
    build:
      context: .
      dockerfile: history-service/Dockerfile
    container_name: history-service
    depends_on:
      - postgres-history-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-history-service:5432/history
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: adminPostgres
    ports:
      - "8083:8083"

volumes:
  mongo-notification-service-data:
  postgres-history-service-data:
